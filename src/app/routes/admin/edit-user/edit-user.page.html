<div class="overflow-auto">
<div class="page-wrapper">
    
	<!-- Preloader -->
  @if(showLoading){
    <app-spinner />
  }
    <!-- Preloader end-->
	
	<!-- Header -->
	<header class="header header-fixed style-1">
		<div class="header-content">
			<div class="left-content">
				<a [routerLink]="['/admin/dashboard/sarys']" class="back-btn ic-icon icon-sm">
					<i class="feather icon-arrow-left"></i>
				</a>
			</div>
			<div class="mid-content"><h5 class="title">Editar Perfil</h5></div>
			<div class="right-content"></div>
		</div>
	</header>
	<!-- Header -->
	
	<!-- Main Content Start -->
	<main class="page-content space-top p-b80">
		<div class="container p-t10 px-2">
			<div class="edit-profile">
				<div class="profile-image">
					<div class="avatar-upload">
					</div>
					<div class="edit-content">
						<h5 class="name mb-1 ">{{ fullName }}</h5>
					</div>	
				</div>

				<div class="card style-2">
					<div class="card-header">
						<h5 class="card-title">Detalles del usuario</h5>
					</div>
					<div class="card-body">
						<form class="ic-form-group" [formGroup]="formEdit">
							<div class="m-b20 input-group input-lg input-group-icon input-rounded">
								<div class="input-group-text">
									<div class="input-icon">
										<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
											<circle cx="14" cy="9.33334" r="4.66667" fill="black"/>
											<path fill-rule="evenodd" clip-rule="evenodd" d="M14 15.1667C9.68579 15.1667 6.1529 18.0341 5.85386 21.6668C5.83121 21.942 6.05722 22.1667 6.33336 22.1667H21.6667C21.9428 22.1667 22.1688 21.942 22.1462 21.6668C21.8472 18.0341 18.3143 15.1667 14 15.1667Z" fill="black" fill-opacity="0.25"/>
										</svg>
									</div>
								</div>
								<input 
                type="text"
                formControlName="name"
                id="name" class="form-control" placeholder="Nombre">								
							</div>
              <div class="m-b20 input-group input-lg input-group-icon input-rounded">
								<div class="input-group-text">
									<div class="input-icon">
										<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
											<circle cx="14" cy="9.33334" r="4.66667" fill="black"/>
											<path fill-rule="evenodd" clip-rule="evenodd" d="M14 15.1667C9.68579 15.1667 6.1529 18.0341 5.85386 21.6668C5.83121 21.942 6.05722 22.1667 6.33336 22.1667H21.6667C21.9428 22.1667 22.1688 21.942 22.1462 21.6668C21.8472 18.0341 18.3143 15.1667 14 15.1667Z" fill="black" fill-opacity="0.25"/>
										</svg>
									</div>
								</div>
								<input 
                formControlName="sub_ape"
                type="text" id="name" class="form-control" placeholder="Apellido">								
							</div>
							<div class="m-b20 input-group input-lg input-group-icon input-rounded">
								<div class="input-group-text">
									<div class="input-icon">
										<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
											<path d="M7.17962 4.48705L7.45956 4.20711C7.85008 3.81658 8.48325 3.81658 8.87377 4.20711L12.1262 7.45956C12.5168 7.85008 12.5168 8.48325 12.1262 8.87377L10.817 10.183C10.6277 10.3723 10.5808 10.6615 10.7005 10.901C12.0849 13.6699 14.3301 15.9151 17.099 17.2995C17.3385 17.4192 17.6277 17.3723 17.817 17.183L19.1262 15.8738C19.5168 15.4832 20.1499 15.4832 20.5404 15.8738L23.7929 19.1262C24.1834 19.5168 24.1834 20.1499 23.7929 20.5404L23.513 20.8204C21.4016 22.9317 18.059 23.1693 15.6703 21.3777L13.1286 19.4714C11.385 18.1638 9.83622 16.615 8.52857 14.8714L6.62226 12.3297C4.83072 9.94096 5.06827 6.5984 7.17962 4.48705Z" fill="black" fill-opacity="0.25"/>
											<path fill-rule="evenodd" clip-rule="evenodd" d="M23.7929 20.5404C24.1834 20.1499 24.1834 19.5168 23.7929 19.1262L20.5404 15.8738C20.5402 15.8735 20.5399 15.8733 20.5397 15.873C20.1491 15.4832 19.5165 15.4835 19.1262 15.8738L18.0833 16.9167L22.6813 21.5146C22.9745 21.3118 23.253 21.0803 23.513 20.8204L23.7929 20.5404ZM11.0833 9.91667L12.1262 8.87377C12.5166 8.48339 12.5167 7.85054 12.1266 7.45998C12.1265 7.45984 12.1264 7.4597 12.1262 7.45956L8.87377 4.20711C8.87372 4.20706 8.87368 4.20701 8.87363 4.20697C8.48327 3.81676 7.8506 3.81663 7.46008 4.20658C7.45991 4.20676 7.45973 4.20693 7.45956 4.20711L7.17962 4.48705C7.17928 4.48739 7.17894 4.48773 7.1786 4.48807C6.9191 4.74769 6.68792 5.02592 6.48535 5.31869L11.0833 9.91667Z" fill="black"/>
										</svg>
									</div>
								</div>
                <input
                [mask]="'(000) 000-0000'"
                prefix="+58 "
                type="text"
                formControlName="phone"
                inputmode="numeric"
                id="phone"
                class="form-control"
                placeholder="Teléfono">
                            
							</div>
							<div class="m-b20 input-group input-lg input-group-icon input-rounded">
								<div class="input-group-text">
									<div class="input-icon">
										<svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
											<path d="M4.6665 12.9721C4.6665 11.7693 4.6665 11.1679 4.9652 10.6846C5.2639 10.2013 5.80182 9.93234 6.87765 9.39442L12.211 6.72775C13.0888 6.28885 13.5277 6.0694 13.9998 6.0694C14.472 6.0694 14.9109 6.28885 15.7887 6.72776L21.122 9.39442C22.1979 9.93234 22.7358 10.2013 23.0345 10.6846C23.3332 11.1679 23.3332 11.7693 23.3332 12.9721V18.1667C23.3332 20.0523 23.3332 20.9951 22.7474 21.5809C22.1616 22.1667 21.2188 22.1667 19.3332 22.1667H8.6665C6.78088 22.1667 5.83808 22.1667 5.25229 21.5809C4.6665 20.9951 4.6665 20.0523 4.6665 18.1667V12.9721Z" fill="black" fill-opacity="0.25"></path>
											<path d="M4.6665 20.1667V11.9094C4.6665 11.7979 4.78385 11.7253 4.88359 11.7752L12.6582 15.6625C13.5028 16.0848 14.4969 16.0848 15.3415 15.6625L23.1161 11.7752C23.2158 11.7253 23.3332 11.7979 23.3332 11.9094V20.1667C23.3332 21.2712 22.4377 22.1667 21.3332 22.1667H6.6665C5.56193 22.1667 4.6665 21.2712 4.6665 20.1667Z" fill="black"></path>
										</svg>
									</div>
								</div>
								<input
                formControlName="email"
                readonly
                type="email" id="email" class="form-control" placeholder="Email">								
							</div>

						</form>
					</div>
				</div>
			</div>
		</div>
	</main>
	<!-- Main Content End -->

	<!-- Footer Fixed Button -->	
	<div class="footer-fixed-btn">
		<a (click)="onSubmit()" class="btn btn-lg btn-thin btn-primary w-100 rounded-xl">Editar Perfil</a>
	</div>	
	<!-- Footer Fixed Button -->	
</div>  

</div>

<div class="toast-container" id="toastContainer"></div>
