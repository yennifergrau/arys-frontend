<div class="body-bg2">
  <div class="page-wrapper full-height">
    <main class="page-content">
      <div class="container pt-0 overflow-hidden">
        <div class="ic-authentication-area ic-flex-box">

          @if (showSpinner) {
            <app-spinner message="Verificando tu membresía..." />
          }

          @if (showVerifyForm) {
            <div class="av-screen">

              <!-- ── Hero ── -->
              <div class="av-hero">
                <div class="av-hero__circles">
                  <span class="av-hero__c1"></span>
                  <span class="av-hero__c2"></span>
                </div>
                <div class="av-hero__symbol">
                  <img src="assets/imagenes/icon/favicon.png" alt="Arys" />
                </div>
                <div class="av-hero__label">CLUB ARYS</div>
                <div class="av-hero__sub">Área exclusiva de miembros</div>
              </div>

              <!-- ── Contenido ── -->
              <div class="av-content">

                <h2 class="av-heading">Accede con tu cédula</h2>
                <p class="av-desc">
                  Ingresa tu número de identificación para verificar si tienes una membresía activa.
                </p>

                <!-- Trust signals -->
                <div class="av-trust">
                  <div class="av-trust__item">
                    <i class="fa-solid fa-lock"></i>
                    <span>Seguro</span>
                  </div>
                  <div class="av-trust__sep"></div>
                  <div class="av-trust__item">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Inmediato</span>
                  </div>
                  <div class="av-trust__sep"></div>
                  <div class="av-trust__item">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>Sin contraseña</span>
                  </div>
                </div>

                <!-- Contexto membresía -->
                <div class="av-member-hint">
                  <i class="fa-solid fa-id-card"></i>
                  <span>Tu cédula o RIF nos indica si eres miembro del Club</span>
                </div>

                <!-- Input -->
                <form class="ic-form-group" [formGroup]="FormVerify">
                  <label class="av-input-label">Cédula o RIF</label>
                  <div class="m-b20 input-group input-lg input-group-icon input-rounded">
                    <div class="input-group-text">
                      <div class="input-icon">
                        <svg width="22" height="22" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <circle cx="14.0002" cy="9.33334" r="4.66667" fill="black"/>
                          <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M13.9998 15.1667C9.68555 15.1667 6.15265 18.0341 5.85362 21.6668C5.83096 21.942 6.05697 22.1667 6.33312 22.1667H21.6664C21.9426 22.1667 22.1686 21.942 22.1459 21.6668C21.8469 18.0341 18.314 15.1667 13.9998 15.1667Z"
                            fill="black" fill-opacity="0.25"/>
                        </svg>
                      </div>
                    </div>
                    <div>
                      <select id="prefix" name="prefix" formControlName="prefix">
                        <option value="V">V</option>
                        <option value="E">E</option>
                        <option value="J">J</option>
                      </select>
                    </div>
                    <input
                      [ngClass]="{'invalid-input': rifControl.invalid && (rifControl.dirty || rifControl.touched)}"
                      type="text"
                      formControlName="rif"
                      value=""
                      inputmode="numeric"
                      class="form-control"
                      placeholder="Ej: 12.345.678"
                      mask="separator.2"
                      thousandSeparator="."
                    />
                  </div>
                </form>

              </div>

              <!-- ── Botón ── -->
              <div class="bottom-btn mt-auto">
                <a (click)="onSubmit()" class="btn btn-primary btn-thin btn-lg w-100 rounded-xl">
                  Verificar membresía
                </a>
              </div>

            </div>
          }
        </div>
      </div>
    </main>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
