
<div class="overflow-auto">
  <div class="page-wrapper">
  
    <!-- Header -->
    <header class="header header-fixed style-1">
      <div class="header-content">
        <div class="left-content">
          <a [routerLink]="['/admin/dashboard/sarys']" class="back-btn ic-icon icon-sm">
            <i class="feather icon-arrow-left"></i>
          </a>
        </div>
        <div class="mid-content"><h5 class="title">Mis compras</h5></div>
        <div class="right-content">
          <a class="ic-icon icon-sm">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M8.25 14.25C11.5637 14.25 14.25 11.5637 14.25 8.25C14.25 4.93629 11.5637 2.25 8.25 2.25C4.93629 2.25 2.25 4.93629 2.25 8.25C2.25 11.5637 4.93629 14.25 8.25 14.25Z" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15.75 15.75L12.4875 12.4875" stroke="black" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </a>
        </div>
      </div>
    </header>
    <!-- Header -->
    
    <!-- Main Content Start -->
    <main class="page-content space-top">
      <div class="container p-2">

        <div class="tabs-container">
          <p 
            (click)="activeTab = 'enProceso'" 
            [class.active]="activeTab === 'enProceso'"
            class="tab">
            En Proceso
          </p>
          <p 
            (click)="activeTab = 'finalizadas'" 
            [class.active]="activeTab === 'finalizadas'"
            class="tab">
            Finalizadas
          </p>
        </div>
        
        <div class="chat-list mt-4">
          
          <!-- En Proceso -->
          <div *ngIf="activeTab === 'enProceso'" class="space-y-4">
            <ul>
              @for(x of purchases ;track $index) {
 <li (click)="routing(x)"
                  class="border rounded-lg p-4 shadow-md flex items-center justify-between hover:bg-gray-100 transition duration-200">
                <a class="list-items flex items-center space-x-4">	
                  <div class="ic-media">
                    <img src="../../../../assets/imagenes/icon/favicon.png" alt="" class="w-16 h-16 rounded-lg">
                  </div>
                  <div class="list-content">
                    <h5 class="title text-gray-800 font-semibold">{{x.commerce}}</h5>
                    <span class="ic-text text-gray-600 text-sm">{{x.document_commerce}}</span>
                  </div>
                </a>
              </li>
              }
             
            </ul>
          </div>

          <!-- Finalizadas -->
          <div *ngIf="activeTab === 'finalizadas'" class="space-y-4">
            <ul>
              <li>
                <span>No se encontraron cuotas finalizadas</span>
              </li>
              <!-- <li class="border rounded-lg p-4 shadow-md flex items-center justify-between bg-green-100">
                <a class="list-items flex items-center space-x-4">	
                  <div class="ic-media">
                    <img src="../../../../assets/imagenes/autos/hyundai.jpg" alt="" class="w-16 h-16 rounded-lg">
                  </div>
                  <div class="list-content">
                    <h5 class="title text-gray-800 font-semibold">Hyundai Lub</h5>
                    <span class="ic-text text-gray-600 text-sm">10/03/2025</span>
                  </div>
                  <span class="data-payment font-bold text-green-600">2.100,75 BS</span>
                </a>
              </li> -->
            </ul>
          </div>

        </div>
      </div>
    </main>
    <app-tab />
  </div>  
  </div>
